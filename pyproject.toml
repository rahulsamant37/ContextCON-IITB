[project]
name = "marketentry"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "jinja2>=3.1",
  "streamlit>=1.36",
  "python-dotenv>=1.0",
  "weasyprint>=62",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["marketentry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
